<!doctype html>
<!-- Dev-only harness for the 3D map: http://localhost:5173/src/map/dev/harness.html[?focus=Bengaluru&inset=400]
     Not part of the app build (vite builds index.html only). -->
<html lang="en" data-type="software" data-radius="soft" data-motion="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Map harness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/system.css" />
    <link rel="stylesheet" href="/assets/motion/motion.css" />
    <style>
      :root {
        --p-bg: #f7f9fa; --p-surface: #ecf0f2; --p-ink: #1f3038; --p-muted: #5d6b72;
        --p-accent: #0d7480; --p-accent-ink: #ffffff; --p-action: #0d7480; --p-action-ink: #ffffff;
        --p-inv-bg: #1f3038; --p-inv-surface: #2c3c44; --p-inv-ink: #f7f9fa; --p-inv-muted: #9ea7ab;
        --p-inv-accent: #f7f9fa; --p-inv-accent-ink: #1f3038; --p-inv-action: #f7f9fa; --p-inv-action-ink: #1f3038;
        --font-display: "Host Grotesk", system-ui, sans-serif;
        --font-text: "Host Grotesk", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        --display-weight: 500;
        --display-tracking: -0.035em;
        --display-tracking-xl: -0.04em;
      }
      html, body, #root { height: 100%; margin: 0; overflow: hidden; }
      /* other pages are built in parallel; their compile errors must not cover the map harness */
      vite-error-overlay { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./harness.tsx"></script>
  </body>
</html>
