<script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"Lowes","value":"JR-02651153"},"hiringOrganization":{"@type":"Organization","name":"Lowes","sameAs":"https://talent.lowes.com/in/en","url":"https://talent.lowes.com/in/en/job/JR-02651153/Analyst-Supply-Chain","logo":null},"jobLocation":{"geo":{"@type":"GeoCoordinates","latitude":"12.97194","longitude":"77.59369"},"address":{"@type":"PostalAddress","postalCode":"560045","addressCountry":"India","addressLocality":"Bengaluru","addressRegion":"Karnātaka"},"@type":"Place"},"employmentType":["FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;p&gt;&lt;b&gt;Innovate in Bengaluru&lt;/b&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;This position is based at our on-site office in Bengaluru. Lowe&#39;s offers an ultramodern work environment, complete with cutting-edge technology, collaborative workspaces, an on-site gym and clinic, and other perks to enhance your work experience.  &lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;&lt;b&gt;&lt;span style=\"font-size:inherit\"&gt;About Lowe’s&lt;/span&gt;&lt;/b&gt;&lt;br /&gt;&lt;span style=\"color:#1e53a3\"&gt;&lt;span style=\"font-size:inherit\"&gt;Lowe’s is a FORTUNE® 100 home improvement company serving approximately 16 million customer transactions a week in the United States. With total fiscal year 2024 sales of more than $83 billion, Lowe’s operates over 1,700 home improvement stores and employs approximately 300,000 associates. Based in Mooresville, N.C., Lowe’s supports the communities it serves through programs focused on creating safe, affordable housing, improving community spaces, helping to develop the next generation of skilled trade experts and providing disaster relief to communities in need. For more information, visit Lowes.com.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;&lt;span style=\"font-size:inherit\"&gt;About Lowe’s India&lt;/span&gt;&lt;/b&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\"color:#1e53a3\"&gt;&lt;span style=\"font-size:inherit\"&gt;Lowe’s India, the Global Capability Center of Lowe’s Companies Inc., is a hub for driving our technology, business, analytics, and shared services strategy. Based in Bengaluru with over 4,500 associates, it powers innovations across omnichannel retail, AI/ML, enterprise architecture, supply chain, and customer experience. From supporting and launching homegrown solutions to fostering innovation through its Catalyze platform, Lowe’s India plays a pivotal role in transforming home improvement retail while upholding strong commitment to social impact and sustainability. For more information, visit &lt;/span&gt;&lt;/span&gt;&lt;a target=\"_blank\" href=\"https://nam11.safelinks.protection.outlook.com/?url&#61;https%3A%2F%2Flowes.co.in%2F&amp;data&#61;05%7C02%7Criddhi.goyal%40lowes.com%7C2f8072d35f314967e03108ddacf1e5f5%7Cbcfa3e87841e48c7983b584159dd1a69%7C0%7C0%7C638856877139027596%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;sdata&#61;Pi1F1ZIfNGNFXtkXvlBPiHI0k5%2FggslzRwunT4SsTXY%3D&amp;reserved&#61;0\"&gt;&lt;span style=\"color:#1e53a3\"&gt;&lt;span style=\"font-size:inherit\"&gt;Lowes India&lt;/span&gt;&lt;/span&gt;&lt;/a&gt;&lt;br /&gt;&lt;b&gt;Job Summary:&lt;/b&gt; &lt;/p&gt;&lt;p&gt;The primary purpose of this role will be to analyze and communicate insights related to how the forecasted flow of product will impact the inventory levels compared to the capacities of the supply chain network. This role will collaborate with various stakeholders across Inventory Planning, DC Operations, Finance to gather inputs which inform and enhances the forecast.  &lt;/p&gt;&lt;p&gt;&lt;b&gt;Roles &amp; Responsibilities:&lt;/b&gt; &lt;/p&gt;&lt;p&gt;&lt;b&gt;Core Responsibilities:&lt;/b&gt; &lt;/p&gt;&lt;ul&gt;&lt;li&gt;Assist in the report creation and analysis to assess how both short and long-term volume forecasts may impact Inbound, Outbound, Storage and product flow capacities for one node &lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;Support the integration of volume flows into the weekly/monthly/yearly capacity and network forecasting processes  &lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;Assist the Inventory Planning team with combining and comparing proposed product flow plans to the established flow plans and their relation to capacity &lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;Perform root cause analysis of current sales and product velocity shifts to determine how they may impact upcoming storage forecasts and capacities &lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;Analyze, predict, and monitor how the Inventory and Replenishment Planning groups activities will affect future inventory and product flow  &lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;Work with the Flow Forecasting analysts to ensure clear and concise communications through email and direct communications for both strategic and tactical consumption to the appropriate stakeholder groups  &lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;Conduct Ad-Hoc analysis using existing data sources and reports to provide any additional actionable insights as they may be needed &lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Years of Experience&lt;/b&gt; &lt;/p&gt;&lt;p&gt;Overall 2&#43; years of Experience &lt;/p&gt;&lt;ul&gt;&lt;li&gt;2&#43; years of experience in Supply chain Management &lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;1&#43; years experience of S&amp;OP/S&amp;OE &lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Education Qualification &amp; Certifications (optional)&lt;/b&gt; &lt;/p&gt;&lt;p&gt;&lt;b&gt;Required Minimum Qualifications&lt;/b&gt;: &lt;/p&gt;&lt;p&gt;Bachelors Degree in Engineering, Supply Chain Management, Operations Research or Related Field &lt;/p&gt;&lt;p&gt;&lt;b&gt;Skill Set Required &lt;/b&gt; &lt;/p&gt;&lt;p&gt;&lt;b&gt;Primary Skills (must have)&lt;/b&gt; &lt;/p&gt;&lt;ul&gt;&lt;li&gt;Experience in Data mining and visualization tool such as SQL, and Excel &lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;Proficient in retail math &amp; supply chain distribution operations. &lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;Ability to manage multiple tasks/projects simultaneously &lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;Highly organized, detail-oriented and accurate &lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;Working knowledge of Merchandising decision-making tools for Suppliers, Items and Sourcing to include Financial determinations &lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;Familiar with Inventory Management, Planning, Forecasting, and Transportation processes and systems   &lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;Excellent writing and communication skills, including the ability to develop analytical documents for presentation to management &lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;Excellent problem solving skills &lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;b&gt;Secondary Skills (desired)&lt;/b&gt; &lt;/p&gt;&lt;ul&gt;&lt;li&gt;Experience in Python  &lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;Prior analytical experience  &lt;/li&gt;&lt;/ul&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;br /&gt;&lt;i&gt;Lowe&#39;s is an equal opportunity employer and administers all personnel practices without regard to race, color, religious creed, sex, gender, age, ancestry, national origin, mental or physical disability or medical condition, sexual orientation, gender identity or expression, marital status, military or veteran status, genetic information, or any other category protected under federal, state, or local law.&lt;/i&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;","title":"Analyst Supply Chain","datePosted":"2026-11-11","@context":"http://schema.org","occupationalCategory":"Supply Chain","directApply":false}</script>
